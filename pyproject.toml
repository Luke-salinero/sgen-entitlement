[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # PEP8 errors
  "F",    # Pyflakes (bugs)
  "I",    # Import sorting
  "B",    # Bugbear (real bugs)
  "SIM",  # Simplify
  "RET",  # Return correctness
  "ASYNC" # Async correctness
]

ignore = [
  "E203",  # Black compatibility
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses function calls in defaults (Depends)
"app/api/**/*.py" = ["B008"]
